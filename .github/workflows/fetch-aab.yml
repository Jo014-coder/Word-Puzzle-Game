name: fetch-aab
on:
  push:
    branches: [tmp-fetch-aab]
permissions:
  contents: write
jobs:
  fetch:
    if: "!contains(github.event.head_commit.message, 'bundle file')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSL -o griddl-1.0.4.aab "https://expo.dev/artifacts/eas/urph2Cm3J9DmRI0VI3TtuiwD4KXzTY4s0begtwgqC50.aab"
          unzip -l griddl-1.0.4.aab | tail -1
          git config user.name bot && git config user.email bot@example.com
          git add griddl-1.0.4.aab && git commit -m "bundle file" && git push
